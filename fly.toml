# Despliegue alternativo en Fly.io (no duerme en el plan gratuito).
app = "vigia-chillon"
primary_region = "scl"   # Santiago, la región más cercana a Lima

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/salud"
